services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: japan-activities-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-japan-activities}
      POSTGRES_USER: ${POSTGRES_USER:-japan-activities}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-japan-activities} -d ${POSTGRES_DB:-japan-activities}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
