server:
  port: ${BACKEND_PORT:8080}
spring:
  application:
    name: japan-discovery
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:japan_discovery}}
    username: ${POSTGRES_USER:japan_discovery}
    password: ${POSTGRES_PASSWORD:change-me-locally}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
